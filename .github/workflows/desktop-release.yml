name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${{ github.event.inputs.version }}"
          if [[ -z "$version" ]]; then
            echo "workflow_dispatch requires version input" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # Build macOS (arm64) and Windows (x64) in parallel
  # ─────────────────────────────────────────────
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            pkg_cmd: package:mac
          - os: windows-latest
            platform: win
            pkg_cmd: package:win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Sync workspace package versions
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const path = require("node:path")

          const version = process.env.RELEASE_VERSION?.trim()
          if (!version) throw new Error("RELEASE_VERSION is required")

          const repoRoot = process.cwd()
          const ignored = new Set(["node_modules", "dist", ".git"])

          function visit(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ignored.has(entry.name)) continue
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) {
                visit(full)
                continue
              }

              if (entry.name !== "package.json") continue

              const raw = fs.readFileSync(full, "utf8")
              const pkg = JSON.parse(raw)
              if (typeof pkg.version !== "string") continue
              if (pkg.version === version) continue
              pkg.version = version
              fs.writeFileSync(full, `${JSON.stringify(pkg, null, 2)}\n`)
              console.log(`updated ${path.relative(repoRoot, full)} -> ${version}`)
            }
          }

          visit(repoRoot)
          NODE

      - name: Install dependencies
        run: bun install

      - name: Build (electron-vite)
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
        run: bun run build

      - name: Package macOS
        if: matrix.platform == 'mac'
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ulimit -n 65536
          # Unset signing vars entirely if no certificate is configured
          unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          bun run package:mac -- --publish never

      - name: Package Windows
        if: matrix.platform == 'win'
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run package:win -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          retention-days: 7
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            !packages/desktop/dist/builder-debug.yml

  # ─────────────────────────────────────────────
  # Create GitHub Release
  # ─────────────────────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: desktop-*

      - name: List artifacts
        run: find release-artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.exe
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # Upload to R2 (replaces existing version)
  # ─────────────────────────────────────────────
  upload-r2:
    needs:
      - build
      - version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install upload dependencies
        run: |
          mkdir -p .upload-deps
          echo '{"name":"upload-deps","private":true}' > .upload-deps/package.json
          npm install --prefix .upload-deps --no-package-lock --no-save @aws-sdk/client-s3
          ln -s .upload-deps/node_modules node_modules || true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: desktop-*

      - name: Flatten artifacts into staging/
        run: |
          mkdir -p staging
          find release-artifacts/ -type f \( \
            -name "*.dmg" -o \
            -name "*.zip" -o \
            -name "*.exe" \
          \) -exec cp {} staging/ \;
          echo "=== Staging files ==="
          ls -lh staging/

      - name: Upload to R2
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ vars.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          node scripts/upload-release.mjs \
            --artifacts-dir staging \
            --version ${{ needs.version.outputs.version }} \
            --prefix releases/exec

      - name: Show upload results
        run: cat upload-results.json
